<!DOCTYPE html>
<html lang="pt-BR">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Gerador de Ditados Populares</title>

		<link rel="stylesheet" href="style.css" />
		<link
			href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<main>
			<h1>Gerador de Ditados Populares</h1>
			<div class="box-content">
				<p class="boxPhrase" id="resultado"></p>
			</div>
			<div class="buttons">
				<button class="newPhrase buttonMain">Gerar Nova Frase</button>
				<button class="copyPhrase buttonMain">Copiar Frase</button>
			</div>
		</main>

		<div id="toast" class="toast">
			<span>✔ Ditado copiado!</span>
			<button class="fechar">&times;</button>
		</div>

		<script src="script.js"></script>
	</body>
</html>
